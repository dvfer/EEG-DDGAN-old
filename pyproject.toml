[project]
name = "eeggan"
version = "2.0.2"
authors = [
  { name="Autonomous Empirical Research Group", email="sebastian_musslick@brown.edu" },
]
description = "This package uses Generative Adversarial Networks (GANs) to augment EEG data to enhance classification performance."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "torch>=2.7,<3.0",
  "torchvision>=0.22,<1.0",
  "torchaudio>=2.7,<3.0",
  "torchsummary>=1.5,<1.6",
  "pandas>=2.2,<2.3",
  "numpy>=1.24,<2.0",
  "matplotlib>=3.5,<4.0",
  "seaborn>=0.12,<0.13",
  "scipy>=1.8,<2.0",
  "einops>=0.6,<1.0",  # braindecode necesita pack/unpack (0.6+); rearrange/reduce/repeat/Rearrange/Reduce, lo único que usa eeggan, no cambió
  "scikit-learn>=1.1,<2.0",
  "tqdm>=4.66,<5.0",
  "moabb>=1.0",
  "mne>=1.5",
  "pytorch_wavelets>=1.3",
  "PyWavelets>=1.1",
  "setuptools<81",
  "braindecode>=0.8.1",
]

[project.urls]
"Homepage" = "https://musslick.github.io/AER_website/Research.html"
"Repository" = "https://github.com/AutoResearch/EEG-GAN"
"Documentation" = "https://autoresearch.github.io/EEG-GAN/"

[project.scripts]
"eeggan" = "eeggan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
